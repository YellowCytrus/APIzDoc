[project]
name = "pizdocore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: integration tests (pandoc+typst, real binaries)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W"]  # E: pycodestyle, F: Pyflakes, W: warnings
ignore = ["E501"]  # line length handled by formatter
